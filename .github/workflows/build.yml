name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair projeto
        run: unzip -q A22Boost.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5
      - name: Compilar
        working-directory: A22Boost
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: A22Boost-apk
          path: A22Boost/app/build/outputs/apk/debug/*.apk
